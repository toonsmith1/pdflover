<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pdflover — เครื่องมือ PDF</title><link rel="stylesheet" href="/styles.css?v=wide">
</head>
<body>
  <header><a class="brand" href="/"><span class="mark">pdf.</span><strong>pdflover</strong><span class="tagline">เครื่องมือเล็ก ๆ สำหรับเอกสารของคุณ</span></a><span class="status">local · ready</span></header>
  <main class="tool-page"><a class="back" href="/">← กลับไปเลือกเครื่องมือ</a><small id="category"></small><h1 id="title">กำลังโหลดเครื่องมือ…</h1><p id="description"></p>
    <section class="panel"><form id="operation-form"><div class="tool-controls"><label class="drop" for="files"><span>เลือกไฟล์ PDF</span><input id="files" name="files" type="file" accept="application/pdf" multiple><em id="file-label">ยังไม่ได้เลือกไฟล์</em></label><label id="pages-field" hidden>หน้าที่ต้องการ <input id="pages" name="pages" placeholder="1, 3, 5"></label><label id="degrees-field" hidden>องศา <select id="degrees"><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select></label><button class="primary" type="submit" id="run">เลือกไฟล์เพื่อเริ่ม</button><p class="message" id="message" aria-live="polite"></p></div><div class="preview" id="preview" hidden><div class="preview-head"><span>ตัวอย่างเอกสาร</span><span id="preview-meta"></span><button type="button" id="preview-expand" aria-expanded="false">ขยายเต็มจอ</button><a id="preview-open" target="_blank" rel="noopener">เปิดแท็บใหม่</a></div><iframe id="pdf-preview" title="ตัวอย่าง PDF"></iframe></div></form></section>
  </main><footer><span>พื้นที่เล็ก ๆ ที่ทำให้งานเอกสารง่ายขึ้น</span><span>pdflover / local-first</span></footer><script src="/tool.js?v=wide"></script>
<script src="/compress-options.js?v=1"></script><script src="/merge.js?v=2"></script><script src="/upload-flow.js?v=1"></script><script src="/organize.js?v=1"></script></body></html>
