<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pdflover — เครื่องมือ PDF</title><link rel="stylesheet" href="/styles.css?v=text-editor">
</head>
<body>
  <header><a class="brand" href="/"><span class="mark">pdf.</span><strong>pdflover</strong><span class="tagline">เครื่องมือเล็ก ๆ สำหรับเอกสารของคุณ</span></a><span class="status">local · ready</span></header>
  <main class="tool-page"><a class="back" href="/">← กลับไปเลือกเครื่องมือ</a><small id="category"></small><h1 id="title">กำลังโหลดเครื่องมือ…</h1><p id="description"></p>
    <section class="panel"><form id="operation-form"><div class="tool-controls"><label class="drop" for="files"><span>เลือกไฟล์ PDF</span><input id="files" name="files" type="file" accept="application/pdf" multiple><em id="file-label">ยังไม่ได้เลือกไฟล์</em></label><label id="pages-field" hidden>หน้าที่ต้องการ <input id="pages" name="pages" placeholder="1, 3, 5"></label><label id="degrees-field" hidden>องศา <select id="degrees"><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select></label><fieldset id="crop-field" hidden><legend>ตัดขอบ (pt)</legend><label>ซ้าย <input id="crop-left" type="number" min="0" value="0"></label><label>ล่าง <input id="crop-bottom" type="number" min="0" value="0"></label><label>ขวา <input id="crop-right" type="number" min="0" value="0"></label><label>บน <input id="crop-top" type="number" min="0" value="0"></label></fieldset><fieldset id="text-field" hidden><legend>ข้อความที่วาง</legend><div id="text-items"></div><button id="text-add" type="button">＋ เพิ่มข้อความ</button></fieldset><div id="text-position-pad" class="text-position-pad" hidden><span>เลือก PDF เพื่อแสดงหน้า แล้วพิมพ์ข้อความเพื่อวางตำแหน่ง</span><div id="text-canvas"><img id="text-page-image" alt="ตัวอย่างหน้า PDF" hidden><div id="text-overlay"></div></div></div><button id="text-process-next" class="primary" type="button" hidden>ไปขั้นตอนประมวลผล →</button><button class="primary" type="submit" id="run">เลือกไฟล์เพื่อเริ่ม</button><p class="message" id="message" aria-live="polite"></p></div><div class="preview" id="preview" hidden><div class="preview-head"><span>ตัวอย่างเอกสาร</span><span id="preview-meta"></span><button type="button" id="preview-expand" aria-expanded="false">ขยายเต็มจอ</button><a id="preview-open" target="_blank" rel="noopener">เปิดแท็บใหม่</a></div><iframe id="pdf-preview" title="ตัวอย่าง PDF"></iframe></div></form></section>
  </main><footer><span>พื้นที่เล็ก ๆ ที่ทำให้งานเอกสารง่ายขึ้น</span><span>pdflover / local-first</span></footer><script src="/tool.js?v=textstage3"></script>
<script src="/compress-options.js?v=1"></script><script src="/merge.js?v=3"></script><script src="/upload-flow.js?v=3"></script><script src="/organize.js?v=1"></script><script src="/text-preview.js?v=8"></script></body></html>
